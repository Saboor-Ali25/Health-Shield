<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>HealthShield — Login</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Arial,sans-serif; background:#f0f4f8; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.box { background:#fff; border:1px solid #dde3ec; border-radius:8px; padding:36px 40px; width:400px; }
.brand { text-align:center; margin-bottom:24px; }
.brand-name { font-size:26px; font-weight:700; color:#1a3a5c; }
.brand-name span { color:#1a56db; }
.brand-tag { font-size:12px; color:#888; margin-top:4px; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:12px; font-weight:700; color:#444; margin-bottom:5px; text-transform:uppercase; }
.form-group input { width:100%; padding:10px 12px; border:1.5px solid #ccc; border-radius:5px; font-size:13px; font-family:Arial; outline:none; }
.form-group input:focus { border-color:#1a3a5c; }
.btn-login { width:100%; padding:11px; background:#1a3a5c; color:#fff; border:none; border-radius:5px; font-size:14px; font-weight:700; cursor:pointer; }
.btn-login:hover { background:#14304e; }
.alert { padding:10px 14px; background:#fef3c7; border:1px solid #fcd34d; color:#92400e; border-radius:5px; font-size:13px; margin-bottom:14px; }
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <div class="brand-name">Health<span>Shield</span></div>
    <div class="brand-tag">Smart Insurance Claim Processing & Fraud Detection</div>
  </div>
  {% with msgs = get_flashed_messages() %}
    {% for msg in msgs %}<div class="alert">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" required/>
    </div>
    <button type="submit" class="btn-login">Login</button>
  </form>
  <div style="text-align:center; margin-top:16px; font-size:13px;">
    Don't have an account? <a href="{{ url_for('signup') }}">Sign up here</a>
  </div>
</div>
</body>
</html>
