<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>HealthShield — Sign Up</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Arial,sans-serif; background:#f0f4f8; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.box { background:#fff; border:1px solid #dde3ec; border-radius:8px; padding:36px 40px; width:400px; }
.brand { text-align:center; margin-bottom:24px; }
.brand-name { font-size:26px; font-weight:700; color:#1a3a5c; }
.brand-name span { color:#1a56db; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:12px; font-weight:700; color:#444; margin-bottom:5px; text-transform:uppercase; }
.form-group input, .form-group select { width:100%; padding:10px 12px; border:1.5px solid #ccc; border-radius:5px; font-size:13px; outline:none; }
.form-group input:focus, .form-group select:focus { border-color:#1a3a5c; }
.btn-signup { width:100%; padding:11px; background:#1a56db; color:#fff; border:none; border-radius:5px; font-size:14px; font-weight:700; cursor:pointer; }
.btn-signup:hover { background:#1443b6; }
.alert { padding:10px 14px; background:#fee2e2; border:1px solid #fca5a5; color:#991b1b; border-radius:5px; font-size:13px; margin-bottom:14px; }
.login-link { text-align:center; margin-top:16px; font-size:13px; }
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <div class="brand-name">Health<span>Shield</span></div>
    <div style="font-size:12px;color:#888;margin-top:4px;">Create your role-based account</div>
  </div>
  {% with msgs = get_flashed_messages() %}
    {% for msg in msgs %}<div class="alert">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="form-group">
      <label>Full Name / Facility Name</label>
      <input type="text" name="name" placeholder="e.g. Sara Khan or City Hospital" required/>
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="Choose a unique username" required/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Create a password" required/>
    </div>
    <div class="form-group">
      <label>Select Your Role</label>
      <select name="role" required>
        <option value="">-- Choose Role --</option>
        <option value="policyholder">Policyholder (Patient)</option>
        <option value="hospital">Hospital / Healthcare Provider</option>
        <option value="officer">Insurance Claims Officer</option>
        <option value="admin">System Administrator</option>
      </select>
    </div>
    <button type="submit" class="btn-signup">Register Account</button>
  </form>
  <div class="login-link">
    Already have an account? <a href="{{ url_for('login') }}">Login here</a>
  </div>
</div>
</body>
</html>
