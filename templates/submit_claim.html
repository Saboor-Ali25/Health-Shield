{% extends "base.html" %}
{% block content %}
<div class="page-title">Submit New Insurance Claim</div>
<div class="page-sub">Fill in all required fields and upload supporting documents</div>
<div class="card">
  <div class="card-title">Claim Submission Form</div>
  <form method="POST">
    <div class="form-row">
      <div class="form-group">
        <label>Policy Number *</label>
        <input type="text" name="policy_no" placeholder="e.g. POL-10041" required/>
      </div>
      <div class="form-group">
        <label>Patient Full Name *</label>
        <input type="text" name="patient" placeholder="Enter patient name" required/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Date of Treatment *</label>
        <input type="date" name="treat_date" required/>
      </div>
      <div class="form-group">
        <label>Treatment / Procedure *</label>
        <select name="treatment" required>
          <option value="">-- Select Treatment --</option>
          <option>Laparoscopic Surgery</option>
          <option>Orthopedic Surgery</option>
          <option>Hip Replacement</option>
          <option>Chemotherapy</option>
          <option>Dialysis Session</option>
          <option>Asthma Treatment</option>
          <option>Hypertension Management</option>
          <option>Cardiac Procedure</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Diagnosis Code (ICD-10) *</label>
        <select name="diagnosis" required>
          <option value="">-- Select Code --</option>
          <option value="K80.2">K80.2 — Calculus of Gallbladder</option>
          <option value="M23.2">M23.2 — Derangement of Meniscus</option>
          <option value="C34.1">C34.1 — Malignant Neoplasm</option>
          <option value="N18.3">N18.3 — Chronic Kidney Disease</option>
          <option value="J45.0">J45.0 — Asthma</option>
          <option value="I10">I10 — Essential Hypertension</option>
          <option value="S72.0">S72.0 — Fracture of Femur</option>
          <option value="I25.1">I25.1 — Atherosclerotic Heart Disease</option>
        </select>
      </div>
      <div class="form-group">
        <label>Claimed Amount (PKR) *</label>
        <input type="number" name="amount" placeholder="e.g. 120000" min="1" required/>
      </div>
    </div>
    <div class="form-group">
      <label>Treating Doctor Name</label>
      <input type="text" name="doctor" placeholder="e.g. Dr. Ayesha Siddiqui"/>
    </div>
    <div class="form-group">
      <label>Treatment Description</label>
      <textarea name="description" placeholder="Brief description of treatment..."></textarea>
    </div>
    <div class="form-group">
      <label>Documents Uploaded (select count)</label>
      <select name="docs_count">
        <option value="0">0 documents</option>
        <option value="1">1 document</option>
        <option value="2" selected>2 documents</option>
        <option value="3">3 documents</option>
        <option value="4">4 documents (complete)</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button type="submit" class="btn btn-primary">Submit Claim</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
